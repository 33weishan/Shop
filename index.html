<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5庫存測試</title>
<style>body{font-family:sans-serif;background:#f5f3fa;margin:0}main{max-width:520px;margin:40px auto;padding:18px}.c{background:#fff;border-radius:22px;padding:24px}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:8px;border-radius:12px;font-size:16px}input{border:1px solid #ddd}button{border:0;background:#6842c2;color:#fff;font-weight:bold;margin-top:20px}#r{margin-top:18px;padding:14px;background:#f3f3f3;border-radius:12px;line-height:1.6}</style></head>
<body><main><div class="c"><h1>V5 庫存扣除測試</h1><p>先測試網站 → Apps Script → Google Sheet。</p>
<p>商品名稱</p><input id="p" value="測試商品01"><p>購買數量</p><input id="q" type="number" min="1" value="1">
<button id="b" onclick="go()">測試扣庫存</button><div id="r">尚未送出。</div></div></main>
<script>const API="https://script.google.com/macros/s/AKfycbxyJSU-_4X3gOCRvfEoEhe2ETWkQjXBcHCTIco4BubYDziINuOYCwLPaCvvzTrimUDU/exec";
async function go(){const b=document.getElementById("b"),r=document.getElementById("r"),productName=document.getElementById("p").value.trim(),quantity=Number(document.getElementById("q").value);if(!productName||!Number.isInteger(quantity)||quantity<1){r.textContent="請輸入正確資料";return}b.disabled=true;r.textContent="送出中…";try{const x=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({productName,quantity})});const d=await x.json();r.innerHTML=d.success?"✅ 扣庫存成功<br>原庫存："+d.oldStock+" → 新庫存："+d.newStock:"❌ "+d.message}catch(e){r.textContent="❌ 連線失敗："+e.message}finally{b.disabled=false}}</script></body></html>
