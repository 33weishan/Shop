/* ==================================================
   ILIA & MORE — Minimal Editorial Shop
   極簡精品商城風格
================================================== */

:root{
  --bg:#f5f2ef;
  --paper:#ffffff;
  --ink:#171717;
  --muted:#77736f;
  --line:#e7e2dd;
  --soft:#eee9e5;
  --radius:4px;
}

/* ---------- 全站 ---------- */

body{
  background:var(--bg) !important;
  color:var(--ink) !important;
  font-family:-apple-system,BlinkMacSystemFont,
    "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif !important;
}

/* 英文精品字 */

.luxury-title,
.brand-name,
.collection-title{
  font-family:Georgia,"Times New Roman",serif !important;
  font-weight:400 !important;
  letter-spacing:.04em;
}

/* ---------- 頂部 ---------- */

.luxury-header{
  height:76px;
  padding:0 26px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#fff;
  border-bottom:1px solid var(--line);
}

.brand-name{
  font-size:22px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:24px;

  font-size:13px;
}

.header-actions button{
  background:none;
  border:0;
  color:var(--ink);
  cursor:pointer;
}

/* ---------- 首頁主視覺 ---------- */

.hero-luxury{
  max-width:1180px;
  margin:0 auto;
  min-height:560px;

  display:grid;
  grid-template-columns:42% 58%;

  background:#eee9e5;
}

.hero-copy{
  padding:80px 30px 60px 55px;

  display:flex;
  flex-direction:column;
  justify-content:center;
}

.hero-copy h1{
  margin:0 0 18px;

  font-family:Georgia,"Times New Roman",serif;
  font-size:58px;
  line-height:.98;
  font-weight:400;
  letter-spacing:.02em;
}

.hero-copy .cn{
  margin:0 0 12px;
  font-size:18px;
  letter-spacing:.12em;
}

.hero-copy .small{
  margin-bottom:28px;

  color:var(--muted);
  font-family:Georgia,"Times New Roman",serif;
  font-size:12px;
  letter-spacing:.18em;
}

.hero-photo{
  min-height:560px;
  overflow:hidden;
}

.hero-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* ---------- 精品黑色按鈕 ---------- */

.luxury-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  width:max-content;

  padding:14px 25px;

  background:#181818;
  color:#fff;

  border:1px solid #181818;
  border-radius:2px;

  font-size:12px;
  letter-spacing:.08em;
  text-decoration:none;

  cursor:pointer;
}

.luxury-btn:hover{
  background:#333;
}

/* ---------- COLLECTION ---------- */

.collection-section{
  max-width:1180px;
  margin:0 auto;
  padding:70px 24px 90px;

  background:#fff;
}

.collection-heading{
  text-align:center;
  margin-bottom:42px;
}

.collection-heading h2{
  margin:0 0 8px;

  font-family:Georgia,"Times New Roman",serif;
  font-size:35px;
  font-weight:400;
  letter-spacing:.04em;
}

.collection-heading p{
  margin:0;
  color:var(--muted);
  font-size:14px;
  letter-spacing:.08em;
}

/* ---------- 五個分類 ---------- */

.collection-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
}

.collection-card{
  grid-column:span 2;

  background:#f3f0ed;

  border:0;
  padding:0;

  overflow:hidden;
  cursor:pointer;

  text-align:center;
}

.collection-card:nth-child(4){
  grid-column:2 / span 2;
}

.collection-card:nth-child(5){
  grid-column:4 / span 2;
}

.collection-image{
  width:100%;
  aspect-ratio:4 / 5;

  background:#eeeae6;
  overflow:hidden;
}

.collection-image img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;

  transition:transform .45s ease;
}

.collection-card:hover .collection-image img{
  transform:scale(1.025);
}

.collection-info{
  padding:20px 10px 22px;
  background:#f7f5f3;
}

.collection-info h3{
  margin:0 0 8px;

  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;
  font-weight:400;
}

.collection-info span{
  font-size:10px;
  letter-spacing:.15em;
}

/* ---------- 原本 panel 精品化 ---------- */

.panel{
  background:#fff !important;
  border:1px solid var(--line) !important;
  border-radius:4px !important;
  box-shadow:none !important;
}

/* ---------- 原本紫色按鈕改黑 ---------- */

.purple{
  background:#181818 !important;
  color:#fff !important;

  border:1px solid #181818 !important;
  border-radius:3px !important;

  box-shadow:none !important;
  font-weight:500 !important;
}

.purple:hover{
  background:#333 !important;
}

/* ---------- 次要按鈕 ---------- */

.secondary{
  background:#fff !important;
  color:#181818 !important;

  border:1px solid #d8d3ce !important;
  border-radius:3px !important;

  box-shadow:none !important;
}

/* ---------- 輸入框 ---------- */

input,
select,
textarea{
  background:#fff !important;
  color:#181818 !important;

  border:1px solid #d8d3ce !important;
  border-radius:3px !important;

  box-shadow:none !important;
}

input:focus,
select:focus,
textarea:focus{
  outline:none !important;
  border-color:#181818 !important;
}

/* ---------- 手機 ---------- */

@media(max-width:700px){

  .luxury-header{
    height:64px;
    padding:0 18px;
  }

  .brand-name{
    font-size:18px;
  }

  .header-actions{
    gap:14px;
  }

  .hero-luxury{
    display:flex;
    flex-direction:column-reverse;
    min-height:auto;
  }

  .hero-photo{
    min-height:390px;
    height:390px;
  }

  .hero-copy{
    padding:38px 25px 45px;
  }

  .hero-copy h1{
    font-size:44px;
  }

  .collection-section{
    padding:48px 16px 65px;
  }

  .collection-heading h2{
    font-size:29px;
  }

  .collection-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .collection-card,
  .collection-card:nth-child(4),
  .collection-card:nth-child(5){
    grid-column:auto;
  }

  .collection-card:last-child{
    grid-column:1 / -1;
  }

  .collection-image{
    aspect-ratio:1 / 1;
  }

  .collection-info{
    padding:15px 5px 17px;
  }

  .collection-info h3{
    font-size:16px;
  }
}
</style></head>
<body><header><div class="brand">RELX & ILIA</div><button class="purple" onclick="showCart()">購物車 <span id="cc">0</span></button></header>
<main class="wrap">
<section id="shop"><div class="hero"><h1>🤍香氛精油💙</h1><div>加購$150指定主機顏色</div><div id="sync" class="muted" style="color:white;margin-top:8px">同步中…</div></div><div class="tabs" id="tabs"></div><div class="grid" id="products"></div></section>
<section id="cart" class="hidden"><div class="panel"><button class="backBtn" onclick="show('shop')">← 返回購物</button><h2>購物車</h2><div id="rows"></div><p><b>共 <span id="tq">0</span> 件</b></p><button class="purple wide" onclick="goCheckout()">前往填寫取貨資料</button><button class="wide" onclick="show('shop')">繼續購物</button></div></section>
<section id="checkout" class="hidden"><div class="panel">
<button type="button" class="secondary" onclick="show('cart')">← 返回購物車</button>
<h2>取貨資料</h2>
<label>姓名</label><input id="name" autocomplete="name" placeholder="請輸入姓名">
<label>手機號碼</label><input id="phone" inputmode="tel" maxlength="10" placeholder="09xxxxxxxx">
<label>取貨超商</label>
<input id="storeType" value="7-ELEVEN" readonly>
<label>7-ELEVEN 門市店號</label>
<input id="storeName" inputmode="numeric" maxlength="6" placeholder="請輸入6碼門市店號" oninput="storeChanged()">
<a class="purple wide" style="display:block;text-align:center;text-decoration:none" href="https://emap.pcsc.com.tw/emap.aspx" target="_blank" rel="noopener">不知道店號？查詢 7-ELEVEN 門市</a>
<div id="storeVerify" class="result hidden"></div>


<div id="msg" class="result hidden"></div>
<button id="orderBtn" class="purple wide" onclick="submitOrder()">確認送出訂單</button>
<button class="wide" onclick="showCart()">返回購物車</button>
<p class="muted">送出後系統會再次確認庫存。訂單成立後才會扣除庫存。</p></div></section>
<section id="done" class="hidden"><div class="panel"><h2>✓ 訂單已成立</h2><div id="receipt" class="summary"></div><p class="muted">我們會盡快處理您的訂單。</p><button class="purple wide" onclick="finish()">完成</button></div></section>
</main><script>
const CSV="https://docs.google.com/spreadsheets/d/1I1i9bTTNYsNlg8qkSi9VLOmci-IplxfBANU-cEJDFoc/export?format=csv&gid=121866907";
const API="https://script.google.com/macros/s/AKfycbxyJSU-_4X3gOCRvfEoEhe2ETWkQjXBcHCTIco4BubYDziINuOYCwLPaCvvzTrimUDU/exec";
const SPECS=[
 {label:"悅刻🥚",nameCol:0,stockCol:1,start:5,end:38},
 {label:"主機",custom:true},
 {label:"ILIA拋棄式6500口",nameCol:6,stockCol:7,start:5,end:28},
 {label:"悅刻8000口拋棄式",nameCol:9,stockCol:10,start:5,end:31},
 {label:"悅刻12000口拋棄式",nameCol:12,stockCol:13,start:5,end:24}
];
let groups=[],active=0,cart={},sending=false;

try{
  cart=JSON.parse(localStorage.getItem("shop_cart")||"{}");
}catch(e){
  cart={};
}

const PACKAGES={
 "悅刻🥚":[
  {id:"c1a",label:"10顆送五代主機（不挑顏色）",price:1500,target:10},
  {id:"c1b",label:"20顆送六代主機（不挑顏色）",price:3000,target:20},
  {id:"c1c",label:"10顆送3顆",price:1500,target:13},
  {id:"c1d",label:"20顆送6顆",price:2900,target:26},
  {id:"c1e",label:"30顆送9顆",price:4200,target:39},
  {id:"c1f",label:"60顆送15顆｜代理價",price:7800,target:75}
 ],
 "ILIA拋棄式6500口":[
  {id:"c2a",label:"🔆 3入",price:1000,target:3},
  {id:"c2b",label:"🔆 5入",price:1500,target:5},
  {id:"c2c",label:"🔆 10入｜代理價",price:2500,target:10},
  {id:"c2d",label:"🌟 我要買10隻以上",price:250,custom:true}
 ],
 "悅刻8000口拋棄式":[
  {id:"c3a",label:"⚡️ 3入",price:1100,target:3},
  {id:"c3b",label:"⚡️ 5入",price:1500,target:5},
  {id:"c3c",label:"⚡️ 10入｜代理價",price:2800,target:10},
  {id:"custom",label:"🌟 我要買10隻以上",custom:true,price:280}
 ],
 "悅刻12000口拋棄式":[
  {id:"c4a",label:"🆕 3入",price:1100,target:3},
  {id:"c4b",label:"🆕 5入",price:1500,target:5},
  {id:"c4c",label:"🆕 10入｜代理價",price:2800,target:10},
  {id:"custom",label:"🌟 我要買10隻以上",custom:true,price:280}
 ]
};
let chosenPackage={};
let draft={};


function csv(t){let a=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x=='"'&&q&&n=='"'){c+='"';i++}else if(x=='"')q=!q;else if(x==','&&!q){r.push(c);c=""}else if((x=='\n'||x=='\r')&&!q){if(x=='\r'&&n=='\n')i++;r.push(c);c="";a.push(r);r=[]}else c+=x}if(c||r.length){r.push(c);a.push(r)}return a}
async function load(){try{
 let z=await fetch(CSV+"&_="+Date.now(),{cache:"no-store"}),all=csv(await z.text());
 groups=SPECS.map((s,g)=>{
   if(!s.custom) return {name:s.label,items:all.slice(s.start,s.end+1).filter(r=>(r[s.nameCol]||"").trim()).map((r,i)=>({key:g+"-"+i,name:(r[s.nameCol]||"").trim(),stock:Math.max(0,parseInt(r[s.stockCol])||0)}))};
   let five=all.slice(5,13).filter(r=>(r[3]||"").trim()).map((r,i)=>({key:"4-five-"+i,name:(r[3]||"").trim(),stock:Math.max(0,parseInt(r[4])||0),sub:"五代主機",price:800}));
   let six=all.slice(22,28).filter(r=>(r[3]||"").trim()).map((r,i)=>({key:"4-six-"+i,name:(r[3]||"").trim(),stock:Math.max(0,parseInt(r[4])||0),sub:"六代主機",price:1200}));
   return {name:"主機",items:[...five,...six]};
 });
 document.getElementById("sync").textContent="✓ 庫存已更新";renderTabs();ensureCandyTitle();render()
}catch(e){document.getElementById("sync").textContent="庫存同步失敗"}}
function renderTabs(){document.getElementById("tabs").innerHTML=groups.map((g,i)=>`<button class="tab ${i===active?"on":""}" onclick="active=${i};renderTabs();render()">${g.name}</button>`).join("")}
function ensureCandyTitle(){
 let tabs=document.getElementById("tabs");
 if(!tabs)return;
 let t=document.getElementById("candyTitle");
 if(!t){
   t=document.createElement("div");
   t.id="candyTitle";
   t.className="panel";
   t.style.cssText="margin-bottom:14px;text-align:center";
   t.innerHTML='<h1 style="margin:0">香水</h1>';
 }
 if(tabs.parentNode) tabs.parentNode.insertBefore(t,tabs);
}
function render(){
 let g=groups[active],cat=SPECS[active].label,box=document.getElementById("products");
 if(cat==="主機"){
   box.style.display="block";
   box.innerHTML=["五代主機","六代主機"].map(sub=>{
     let price=sub==="五代主機"?800:1200,items=g.items.filter(p=>p.sub===sub);
     return `<div class="panel" style="margin-bottom:14px"><h2>${sub}｜$${price}／隻</h2><div class="grid">`+
       items.map(p=>productPicker(p,cat,true)).join("")+`</div></div>`;
   }).join("");
   return;
 }
 box.style.display="block";
 let packs=PACKAGES[cat]||[],cp=chosenPackage[cat];
 box.innerHTML=`<div class="panel" style="margin-bottom:14px"><h2>選擇套組</h2><select onchange="choosePack('${cat}',this.value)"><option value="">請先選擇套組</option>${packs.map(p=>`<option value="${p.id}" ${cp&&cp.id===p.id?"selected":""}>${p.label}－$${p.price}</option>`).join("")}</select>${cp?`<div class="result"><b>${cp.label}｜$${cp.price}</b><br>已選 <b>${draftTotal(cat)} / ${cp.target}</b> 顆</div>`:""}</div>`+
   (cp?`<div class="grid">${g.items.map(p=>productPicker(p,cat,false)).join("")}</div><div class="panel" style="margin-top:14px"><button class="purple wide" onclick="addPackage('${cat}')">加入此套組到購物車</button></div>`:`<div class="panel">請先選擇上方套組，再挑選口味。</div>`);
}
function productPicker(p,cat,isC5){
 let q=draft[p.key]||0;
 return `<div class="card"><div class="name">${esc(p.name)}</div><div class="stock">庫存 ${p.stock}</div><div class="qty"><button onclick="pick('${p.key}',-1,'${cat}',${isC5})">−</button><input type="number" min="0" max="${p.stock}" value="${q}" inputmode="numeric" onchange="pickSet('${p.key}',this.value,'${cat}',${isC5})"><button onclick="pick('${p.key}',1,'${cat}',${isC5})">＋</button></div>${isC5?`<button class="add" style="margin-top:10px" onclick="addC5('${p.key}')">加入購物車</button>`:""}</div>`;
}
function choosePack(cat,id){
  const pack=(PACKAGES[cat]||[]).find(x=>x.id===id)||null;

  Object.keys(draft)
    .filter(k=>k.startsWith(String(active)+"-"))
    .forEach(k=>delete draft[k]);

  if(!pack){
    chosenPackage[cat]=null;
    render();
    return;
  }

  if(pack.custom){
    const input=prompt("請輸入購買數量（至少11隻）","11");

    if(input===null){
      chosenPackage[cat]=null;
      render();
      return;
    }

    const qty=parseInt(input,10);

    if(!Number.isInteger(qty)||qty<11){
      alert("請輸入11隻以上的數量");
      chosenPackage[cat]=null;
      render();
      return;
    }

    chosenPackage[cat]={
      ...pack,
      target:qty,
      price:qty*pack.price,
      label:"🔆 "+qty+"入｜$"+(qty*pack.price)
    };

  }else{
    chosenPackage[cat]=pack;
  }

  render();
}
function draftTotal(cat){let gi=SPECS.findIndex(x=>x.label===cat);return Object.entries(draft).filter(([k])=>k.startsWith(gi+"-")).reduce((s,[,q])=>s+q,0)}
function pick(k,d,cat,isC5){let p=find(k),n=Math.max(0,(draft[k]||0)+d);if(!isC5){let cp=chosenPackage[cat],other=draftTotal(cat)-(draft[k]||0);n=Math.min(n,Math.max(0,cp.target-other))}draft[k]=Math.min(n,p.stock);render()}
function pickSet(k,v,cat,isC5){let p=find(k),n=Math.max(0,parseInt(v,10)||0);if(!isC5){let cp=chosenPackage[cat],other=draftTotal(cat)-(draft[k]||0);n=Math.min(n,Math.max(0,cp.target-other))}draft[k]=Math.min(n,p.stock);render()}
function addPackage(cat){let cp=chosenPackage[cat];if(!cp)return;if(draftTotal(cat)!==cp.target)return alert("必須剛好選滿 "+cp.target+" 顆");let gi=SPECS.findIndex(x=>x.label===cat),items=[];Object.entries(draft).forEach(([k,q])=>{if(q>0&&k.startsWith(gi+"-"))items.push({key:k,qty:q})});let bundleKey="B-"+Date.now()+"-"+Math.random().toString(36).slice(2,6);cart[bundleKey]={bundle:true,category:cat,packageId:cp.id,packageLabel:cp.label,price:cp.price,target:cp.target,items};items.forEach(x=>delete draft[x.key]);count();showCart()}
function addC5(k){let q=draft[k]||0,p=find(k);if(q<=0)return alert("請先選擇數量");let bundleKey="C5-"+Date.now()+"-"+Math.random().toString(36).slice(2,6);cart[bundleKey]={bundle:true,category:"主機",packageLabel:p.sub,price:p.price,target:q,items:[{key:k,qty:q}]};draft[k]=0;count();showCart()}
function find(k){for(let g of groups){let p=g.items.find(x=>x.key===k);if(p)return p}}
function add(k){let p=find(k),q=cart[k]||0;if(q<p.stock)cart[k]=q+1;count()}
function orderTotal(){return Object.values(cart).reduce((s,b)=>s+(b.category==="主機"?Number(b.price||0)*Number(b.target||0):Number(b.price||0)),0)}
function count(){
  document.getElementById("cc").textContent=
    Object.values(cart).reduce(
      (s,b)=>s+(b.bundle?b.items.reduce((a,x)=>a+x.qty,0):b),
      0
    );

  localStorage.setItem("shop_cart",JSON.stringify(cart));
}
function show(id){["shop","cart","checkout","done"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));scrollTo(0,0)}
function showCart(){
 let entries=Object.entries(cart),el=document.getElementById("rows");
 if(!entries.length)el.innerHTML="<p>購物車目前是空的。</p>";
 else{
  let grouped={};entries.forEach(([k,b])=>{let cat=b.category||"其他";(grouped[cat]||(grouped[cat]=[])).push([k,b])});
  el.innerHTML=Object.entries(grouped).map(([cat,arr])=>`<div class="catTitle">${esc(cat)}</div>`+arr.map(([bk,b])=>`<div class="card" style="margin:10px 0"><b>${esc(b.packageLabel)}｜$${b.price}</b>${b.category==="主機"?` <span class="muted">／包</span>`:""}<div class="muted" style="margin-top:7px">${b.items.map(x=>{let p=find(x.key);return esc(p.name)+" × "+x.qty}).join("、")}</div><button style="margin-top:10px" onclick="delete cart['${bk}'];count();showCart()">刪除此套組</button></div>`).join("")).join("");
 }
 document.getElementById("tq").textContent=Object.values(cart).reduce((s,b)=>s+b.items.reduce((a,x)=>a+x.qty,0),0);
 let totalBox=document.getElementById("orderTotalBox");
 if(!totalBox){totalBox=document.createElement("div");totalBox.id="orderTotalBox";totalBox.className="result";document.getElementById("tq").parentElement.appendChild(totalBox)}
 totalBox.innerHTML="<b>訂單總金額：$"+orderTotal().toLocaleString()+"</b><br>商品：香水｜溫層：常溫";
 show("cart")
}
function goCheckout(){if(!Object.keys(cart).length)return alert("購物車沒有商品");show("checkout")}
function makeId(){return "ORD-"+Date.now()+"-"+Math.random().toString(36).slice(2,9)}
function postNoCors(payload){return fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})}
function checkStatus(orderId){return new Promise((resolve,reject)=>{let cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),s=document.createElement("script"),timer;window[cb]=d=>{cleanup();resolve(d)};function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}s.onerror=()=>{cleanup();reject(Error("查詢失敗"))};timer=setTimeout(()=>{cleanup();reject(Error("查詢逾時"))},8000);s.src=API+"?orderId="+encodeURIComponent(orderId)+"&callback="+cb+"&_="+Date.now();document.body.appendChild(s)})}
async function waitResult(id){for(let i=0;i<12;i++){try{let d=await checkStatus(id);if(d.status==="completed"||d.status==="failed")return d}catch(e){}await new Promise(r=>setTimeout(r,1000))}throw Error("訂單已送出，但暫時無法確認結果。請勿重複送出")}
function storeChanged(){
 let v=document.getElementById("storeName").value.replace(/\D/g,"").slice(0,6);
 document.getElementById("storeName").value=v;
 let box=document.getElementById("storeVerify");
 if(!v){box.classList.add("hidden");return}
 box.classList.remove("hidden");
 if(v.length<6){
   box.innerHTML="請輸入完整6碼門市店號";
   return;
 }
 box.innerHTML="✓ 店號格式正確：<b>"+esc(v)+"</b>";
}
async function submitOrder(){if(sending)return;let name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.replace(/\s/g,""),storeType=document.getElementById("storeType").value,storeName=document.getElementById("storeName").value.trim(),m=document.getElementById("msg");
if(!name)return alert("請填寫姓名");if(!/^09\d{8}$/.test(phone))return alert("請輸入正確的10碼手機號碼");if(!storeType)return alert("請選擇取貨超商");
if(!/^\d{6}$/.test(storeName))return alert("請輸入6碼 7-ELEVEN 門市店號");
let items=[];Object.entries(cart).forEach(([bundleKey,b])=>b.items.forEach(x=>{let p=find(x.key);items.push({bundleKey:bundleKey,category:b.category,subCategory:p.sub||"",packageLabel:b.packageLabel,packagePrice:b.price,productName:p.name,quantity:x.qty})}));;let orderId=makeId();let orderMeta={productType:"香水",temperature:"常溫",totalAmount:orderTotal()};sending=true;let b=document.getElementById("orderBtn");b.disabled=true;m.classList.remove("hidden");m.textContent="訂單送出中，請勿重複按…";
try{await postNoCors({orderId,customer:{name,phone,storeType,storeName},items});let d=await waitResult(orderId);if(!d.success){m.textContent="❌ "+(d.message||"訂單失敗");await load();return}
document.getElementById("receipt").innerHTML=`訂單編號：<b>${esc(d.orderId)}</b><br>姓名：${esc(d.customer.name)}<br>手機：${esc(d.customer.phone)}<br>取貨超商：${esc(d.customer.storeType)}<br>取貨門市：${esc(d.customer.storeName)}<br><br>商品：<br>`+(()=>{
 let gs={};
 (d.items||[]).forEach(x=>{
   let cat=x.category||"未分類";
   let pack=x.packageLabel||"";
   let key=cat+"||"+pack;
   if(!gs[key])gs[key]={cat,pack,items:[]};
   gs[key].items.push(x);
 });
 return Object.values(gs).map(g=>`<b>${esc(g.cat)}</b>${g.pack?`｜${esc(g.pack)}`:""}<br>`+g.items.map(x=>`${esc(x.productName)} × ${x.quantity}`).join("<br>")).join("<br><br>");
})();
cart={};localStorage.removeItem("shop_cart");count();await load();show("done")}catch(e){m.textContent="⚠️ "+e.message+"（訂單編號："+orderId+"）"}finally{sending=false;b.disabled=false}}
function finish(){document.getElementById("name").value="";document.getElementById("phone").value="";document.getElementById("storeType").value="7-ELEVEN";document.getElementById("storeName").value="";
document.getElementById("storeVerify").classList.add("hidden");
document.getElementById("msg").classList.add("hidden");show("shop")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
load();
count();
</script></body></html>
