function checkAgentCode() {
  const input = document.getElementById('agentCode');
  const result = document.getElementById('agentCodeResult');
  const bossPriceBox = document.getElementById('bossPriceBox');
  const bossPrice = document.getElementById('bossPrice');

  const code = String(input.value || '').trim().toLowerCase();

  // 預設先把優惠價輸入框隱藏
  bossPriceBox.classList.add('hidden');

  if (!code) {
    result.classList.add('hidden');
    result.textContent = '';
    bossPrice.value = '';
    return;
  }

  if (code === 'alan111') {
    result.textContent = '✓ Alan 代理單';
    result.classList.remove('hidden');
    bossPrice.value = '';
    return;
  }

  if (code === 'ding000') {
    result.textContent = '✓ 丁丁 代理單';
    result.classList.remove('hidden');
    bossPrice.value = '';
    return;
  }

  if (code === 'bossvip') {
    result.textContent = '✓ 老闆優惠價';
    result.classList.remove('hidden');

    // 只有 bossvip 才顯示優惠價輸入框
    bossPriceBox.classList.remove('hidden');
    return;
  }

  result.textContent = '代理碼無效，請確認後重新輸入';
  result.classList.remove('hidden');
  bossPrice.value = '';
}

document.getElementById("receipt").innerHTML=`訂單編號：<b>${esc(d.orderId)}</b><br>姓名：${esc(d.customer.name)}<br>手機：${esc(d.customer.phone)}<br>取貨超商：${esc(d.customer.storeType)}<br>取貨門市：${esc(d.customer.storeName)}<br>${d.orderType==="代理單" ? "" : `訂單金額：$${esc(d.totalAmount)}<br>`}<br>商品：<br>`+(()=>{
 let gs={};
 (d.items||[]).forEach(x=>{
   let cat=x.category||"未分類";
   let pack=x.packageLabel||"";
   let key=cat+"||"+pack;
   if(!gs[key])gs[key]={cat,pack,items:[]};
   gs[key].items.push(x);
 });
 return Object.values(gs).map(g=>`<b>${esc(g.cat)}</b>${g.pack?`｜${esc(g.pack)}`:""}<br>`+g.items.map(x=>`${esc(x.productName)} × ${x.quantity}`).join("<br>")).join("<br><br>");
})();
cart={};localStorage.removeItem("shop_cart");count();await load();show("done")}catch(e){m.textContent="⚠️ "+e.message+"（訂單編號："+orderId+"）"}finally{sending=false;b.disabled=false}}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
count();
   
let shopSlideIndex = 0;
let shopSlideTimer = null;

function initShopSlider(){
  clearInterval(shopSlideTimer);

  const track = document.querySelector(".slider-track");
  const slides = document.querySelectorAll(".slider-track img");

  if(!track || !slides.length) return;

  const dotsBox = document.querySelector(".slider-dots");

if(dotsBox){
  dotsBox.innerHTML = Array.from(slides).map((_,i)=>
    `<span class="slider-dot ${i===0 ? "active" : ""}"></span>`
  ).join("");
}
  shopSlideIndex = 0;

  shopSlideTimer = setInterval(()=>{
    moveShopSlider(1);
  },4000);
}

function moveShopSlider(direction){
  const track = document.querySelector(".slider-track");
  const slides = document.querySelectorAll(".slider-track img");
  const dots = document.querySelectorAll(".slider-dot");

  if(!track || !slides.length) return;

  shopSlideIndex += direction;

  if(shopSlideIndex >= slides.length){
    shopSlideIndex = 0;
  }

  if(shopSlideIndex < 0){
    shopSlideIndex = slides.length - 1;
  }

  track.scrollTo({
    left: track.clientWidth * shopSlideIndex,
    behavior:"smooth"
  });

  dots.forEach((dot,i)=>{
    dot.classList.toggle("active",i===shopSlideIndex);
  });
}

function openImage(src){
  const lightbox = document.getElementById("imageLightbox");
  const photo = document.getElementById("imageLightboxPhoto");

  photo.src = src;
  lightbox.classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeImage(){
  const lightbox = document.getElementById("imageLightbox");
  lightbox.classList.remove("show");
  document.body.style.overflow = "";
}
