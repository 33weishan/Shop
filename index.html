<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>測試商城 V4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f4fb;color:#202124}
header{position:sticky;top:0;background:#fff;padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;z-index:5}
h1{font-size:25px;margin:0}.badge{font-size:14px;background:#eee;padding:5px 10px;border-radius:20px}.cartbtn,.primary{background:#6842c2;color:#fff;border:0;border-radius:16px;padding:13px 18px;font-weight:800;font-size:16px}
main{max-width:760px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#6842c2,#9274dc);color:#fff;padding:26px;border-radius:24px;margin-bottom:18px}
.hero h2{font-size:30px;margin:0 0 8px}.status{font-size:14px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#fff;border-radius:22px;padding:18px}.name{font-size:20px;font-weight:800}.stock{color:#777;margin:7px 0 15px}.add{width:100%;border:0;border-radius:14px;padding:12px;background:#6842c2;color:#fff;font-weight:800}
.add:disabled{background:#ccc}.panel{background:#fff;border-radius:22px;padding:20px;margin-top:18px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.qty button{border:0;border-radius:9px;padding:7px 11px;font-size:17px}.qty span{display:inline-block;min-width:30px;text-align:center}
input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:6px 0 13px}.hidden{display:none}
.total{font-size:20px;font-weight:800;margin:18px 0}.note{font-size:13px;color:#777;line-height:1.5}.success{font-size:25px;font-weight:900;margin-bottom:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}header{padding:16px}main{padding:14px}}
</style></head>
<body>
<header><div><h1>測試商城 <span class="badge">V4</span></h1></div><button class="cartbtn" onclick="showCart()">購物車 <span id="cartCount">0</span></button></header>
<main>
<section id="shop">
<div class="hero"><h2>線上選購測試</h2><div>Google Sheets 即時庫存・購物車・取貨流程</div><div id="sync" class="status">⏳ 正在同步庫存…</div></div>
<div id="products" class="grid"></div>
</section>

<section id="cart" class="hidden">
<div class="panel"><h2>購物車</h2><div id="cartItems"></div><div class="total">共 <span id="totalQty">0</span> 件</div>
<button class="primary" style="width:100%" onclick="checkout()">填寫取貨資料</button>
<button onclick="backShop()" style="width:100%;margin-top:10px;padding:12px;border:0;background:#eee;border-radius:14px">繼續購物</button></div>
</section>

<section id="form" class="hidden">
<div class="panel"><h2>取貨資料</h2>
<label>姓名</label><input id="name" placeholder="請輸入姓名">
<label>電話</label><input id="phone" inputmode="tel" placeholder="09xxxxxxxx">
<label>取貨方式</label><select id="carrier"><option>7-ELEVEN 店到店（測試）</option><option>全家店到店（測試）</option></select>
<label>取貨門市</label><input id="store" placeholder="例如：英海門市">
<p class="note">目前為前端測試流程，不會送出真實物流訂單，也不會扣除 Google Sheets 雲端庫存。</p>
<button class="primary" style="width:100%" onclick="placeOrder()">建立測試訂單</button></div>
</section>

<section id="done" class="hidden"><div class="panel"><div class="success">✓ 測試訂單成立</div><div id="receipt"></div><p class="note">此訂單只存在目前瀏覽器測試流程，尚未串接真實物流或付款。</p><button class="primary" style="width:100%" onclick="resetShop()">繼續購物</button></div></section>
</main>
<script>
const CSV="https://docs.google.com/spreadsheets/d/1I1i9bTTNYsNlg8qkSi9VLOmci-IplxfBANU-cEJDFoc/export?format=csv&gid=1126994590";
let products=[], cart={};

function parseCSV(t){let a=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x=='"'&&q&&n=='"'){c+='"';i++}else if(x=='"')q=!q;else if(x==','&&!q){r.push(c);c=""}else if((x=='\n'||x=='\r')&&!q){if(x=='\r'&&n=='\n')i++;r.push(c);c="";if(r.some(v=>v.trim()))a.push(r);r=[]}else c+=x}if(c||r.length){r.push(c);if(r.some(v=>v.trim()))a.push(r)}return a}

async function load(){
 try{
  let res=await fetch(CSV+"&_="+Date.now(),{cache:"no-store"}); if(!res.ok) throw Error(res.status);
  let rows=parseCSV(await res.text()).slice(1);
  products=rows.filter(r=>(r[0]||"").trim()).map((r,i)=>({id:i,name:(r[0]||"").trim(),stock:Math.max(0,parseInt(r[1])||0)}));
  document.getElementById("sync").textContent="✅ Google Sheets 已同步｜"+products.length+" 項｜"+new Date().toLocaleTimeString("zh-TW");
  renderProducts();
 }catch(e){document.getElementById("sync").textContent="❌ 庫存同步失敗，請檢查試算表共用權限";}
}
function renderProducts(){
 let el=document.getElementById("products");
 el.innerHTML=products.map(p=>`<div class="card"><div class="name">${esc(p.name)}</div><div class="stock">庫存 ${p.stock}</div><button class="add" ${p.stock<1?"disabled":""} onclick="add(${p.id})">${p.stock<1?"已售完":"加入購物車"}</button></div>`).join("");
}
function add(id){let p=products.find(x=>x.id===id),q=cart[id]||0;if(q<p.stock)cart[id]=q+1;updateCount()}
function updateCount(){document.getElementById("cartCount").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function showOnly(id){["shop","cart","form","done"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));scrollTo(0,0)}
function showCart(){renderCart();showOnly("cart")}
function renderCart(){
 let ids=Object.keys(cart).filter(id=>cart[id]>0),el=document.getElementById("cartItems");
 if(!ids.length) el.innerHTML="<p>購物車目前沒有商品。</p>";
 else el.innerHTML=ids.map(id=>{let p=products.find(x=>x.id==id);return `<div class="row"><div><b>${esc(p.name)}</b><br><small>庫存 ${p.stock}</small></div><div class="qty"><button onclick="chg(${id},-1)">−</button><span>${cart[id]}</span><button onclick="chg(${id},1)">＋</button></div></div>`}).join("");
 document.getElementById("totalQty").textContent=Object.values(cart).reduce((a,b)=>a+b,0)
}
function chg(id,d){let p=products.find(x=>x.id==id);cart[id]=Math.max(0,Math.min(p.stock,(cart[id]||0)+d));if(!cart[id])delete cart[id];updateCount();renderCart()}
function backShop(){showOnly("shop")}
function checkout(){if(!Object.values(cart).some(x=>x>0)){alert("請先加入商品");return}showOnly("form")}
function placeOrder(){
 let n=document.getElementById("name").value.trim(),ph=document.getElementById("phone").value.trim(),st=document.getElementById("store").value.trim(),ca=document.getElementById("carrier").value;
 if(!n||!ph||!st){alert("請填寫姓名、電話與取貨門市");return}
 let qty=Object.values(cart).reduce((a,b)=>a+b,0),no="TEST-"+String(Date.now()).slice(-8);
 document.getElementById("receipt").innerHTML=`訂單編號 <b>${no}</b><br>共 ${qty} 件<br>${esc(ca)} / ${esc(st)}<br>收件人：${esc(n)}`;
 showOnly("done");
}
function resetShop(){cart={};updateCount();showOnly("shop");load()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
load();
</script></body></html>
