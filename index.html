<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>我的商店 V1</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f6f4fb;color:#222}header{position:sticky;top:0;background:#fff;padding:16px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;z-index:3}.brand{font-weight:800;font-size:20px}.cartbtn{border:0;background:#6842c2;color:#fff;border-radius:20px;padding:10px 14px}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#6842c2,#9b7be5);color:#fff;padding:24px;border-radius:20px;margin-bottom:18px}.hero h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 5px 20px #0000000c}.pic{height:130px;border-radius:14px;background:#eee;display:grid;place-items:center;font-size:42px}.name{font-weight:700;margin-top:10px}.price{font-size:19px;font-weight:800;margin:7px 0}.stock{font-size:13px;color:#666}.add{width:100%;margin-top:10px;border:0;border-radius:12px;padding:11px;background:#6842c2;color:white;font-weight:700}.panel{background:#fff;border-radius:18px;padding:18px;margin-top:18px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.field{margin:12px 0}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px}.primary{width:100%;border:0;border-radius:13px;padding:14px;background:#6842c2;color:#fff;font-size:17px;font-weight:800}.muted{color:#777;font-size:13px}.hidden{display:none}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:1px solid #ddd;background:#fff;padding:8px 12px;border-radius:18px}.tab.active{background:#222;color:#fff}.order{border:1px solid #eee;border-radius:14px;padding:12px;margin:10px 0}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.pic{height:105px}.wrap{padding:12px}}</style></head><body><header><div class='brand'>我的商店</div><button class='cartbtn' onclick='showCart()'>購物車 <span id='count'>0</span></button></header><main class='wrap'><section id='shop'><div class='hero'><h1>線上選購</h1><div>即時庫存・購物車・超商取貨測試版</div></div><div class='tabs'><button class='tab active'>全部商品</button><button class='tab'>熱門</button><button class='tab'>新品</button></div><div id='products' class='grid'></div></section><section id='cart' class='hidden'><div class='panel'><h2>購物車</h2><div id='cartRows'></div><div class='row'><b>商品總額</b><b id='total'>$0</b></div><button class='primary' onclick='checkout()'>前往結帳</button></div></section><section id='checkout' class='hidden'><div class='panel'><h2>結帳資料</h2><div class='field'><label>姓名</label><input id='name' placeholder='取貨人姓名'></div><div class='field'><label>電話</label><input id='phone' inputmode='tel' placeholder='09xxxxxxxx'></div><div class='field'><label>配送方式</label><select id='ship'><option>7-ELEVEN 店到店（測試）</option><option>全家店到店（測試）</option></select></div><div class='field'><label>取貨門市</label><input id='store' placeholder='V1 先手動輸入；正式版接官方選店地圖'></div><p class='muted'>目前不會送出真實物流單。正式串接 API 前先把訂單流程測通。</p><button class='primary' onclick='placeOrder()'>確認送出訂單</button></div></section><section id='done' class='hidden'><div class='panel'><h2>✓ 訂單成立</h2><p id='doneText'></p><button class='primary' onclick='goShop()'>繼續購物</button></div></section><section class='panel'><details><summary><b>店家測試後台</b></summary><div id='orders'></div><button class='primary' onclick='clearOrders()'>清除測試訂單</button></details></section></main><script>
const initial=[{id:1,name:'測試商品 A',price:300,stock:20,icon:'📦'},{id:2,name:'測試商品 B',price:500,stock:12,icon:'🎁'},{id:3,name:'測試商品 C',price:800,stock:8,icon:'🛍️'},{id:4,name:'測試商品 D',price:1200,stock:5,icon:'✨'}];
let products=JSON.parse(localStorage.getItem('productsV1'))||initial, cart=[];
function save(){localStorage.setItem('productsV1',JSON.stringify(products))}function render(){productsEl=document.getElementById('products');productsEl.innerHTML=products.map(p=>`<div class=card><div class=pic>${p.icon}</div><div class=name>${p.name}</div><div class=price>$${p.price.toLocaleString()}</div><div class=stock>${p.stock?'庫存 '+p.stock:'已售完'}</div><button class=add ${p.stock?'':'disabled'} onclick='add(${p.id})' ${p.stock?'':'disabled'}>${p.stock?'加入購物車':'售完'}</button></div>`).join('');renderOrders()}
function add(id){let p=products.find(x=>x.id===id), c=cart.find(x=>x.id===id);let qty=c?c.qty:0;if(qty>=p.stock)return alert('已達庫存上限');c?c.qty++:cart.push({...p,qty:1});count.textContent=cart.reduce((s,x)=>s+x.qty,0)}
function hide(){['shop','cart','checkout','done'].forEach(x=>document.getElementById(x).classList.add('hidden'))}function showCart(){hide();cartEl=document.getElementById('cart');cartEl.classList.remove('hidden');cartRows.innerHTML=cart.length?cart.map(x=>`<div class=row><span>${x.name} × ${x.qty}</span><b>$${(x.price*x.qty).toLocaleString()}</b></div>`).join(''):'購物車目前是空的';total.textContent='$'+cart.reduce((s,x)=>s+x.price*x.qty,0).toLocaleString()}function checkout(){if(!cart.length)return alert('請先加入商品');hide();document.getElementById('checkout').classList.remove('hidden')}function placeOrder(){let n=name.value.trim(),ph=phone.value.trim(),st=store.value.trim();if(!n||!ph||!st)return alert('請填寫姓名、電話與門市');let orders=JSON.parse(localStorage.getItem('ordersV1'))||[];let no='V1-'+Date.now().toString().slice(-8);let order={no,date:new Date().toLocaleString('zh-TW'),name:n,phone:ph,ship:ship.value,store:st,items:cart.map(x=>({id:x.id,name:x.name,qty:x.qty,price:x.price})),total:cart.reduce((s,x)=>s+x.price*x.qty,0)};for(const c of cart){let p=products.find(x=>x.id===c.id);p.stock-=c.qty}orders.unshift(order);localStorage.setItem('ordersV1',JSON.stringify(orders));save();cart=[];count.textContent=0;hide();done.classList.remove('hidden');doneText.textContent=`訂單編號 ${no}，總額 $${order.total.toLocaleString()}，配送：${order.ship} / ${order.store}`;render()}
function goShop(){hide();shop.classList.remove('hidden')}function renderOrders(){let os=JSON.parse(localStorage.getItem('ordersV1'))||[];orders.innerHTML=os.length?os.map(o=>`<div class=order><b>${o.no}</b>｜${o.name}<br>${o.items.map(i=>i.name+'×'+i.qty).join('、')}<br>${o.ship}｜${o.store}｜<b>$${o.total.toLocaleString()}</b><br><span class=muted>${o.date}</span></div>`).join(''):'尚無測試訂單'}function clearOrders(){if(confirm('清除本機測試訂單？')){localStorage.removeItem('ordersV1');renderOrders()}}render();
</script></body></html>
