let currentAgentConfig = null;
let agentCheckTimer = null;

async function checkAgentCode() {
  const input = document.getElementById('agentCode');
  const result = document.getElementById('agentCodeResult');
  const bossPriceBox = document.getElementById('bossPriceBox');
  const bossPrice = document.getElementById('bossPrice');
  const paymentBox = document.getElementById('agentPaymentBox');

  const code = String(input.value || '').trim().toLowerCase();

  // 每次代理碼改變，舊的代理資料立即失效
  currentAgentConfig = null;

  // 尚未正式進入付款階段前，付款區保持隱藏
  paymentBox.classList.add('hidden');

  // bossvip 優惠價預設隱藏
  bossPriceBox.classList.add('hidden');

  // 清掉上一個延遲查詢
  if (agentCheckTimer) {
    clearTimeout(agentCheckTimer);
    agentCheckTimer = null;
  }

  if (!code) {
    result.classList.add('hidden');
    result.textContent = '';
    bossPrice.value = '';
    return;
  }

  // bossvip 維持原本功能，不進代理管理
  if (code === 'bossvip') {
    result.textContent = '✓ 老闆優惠價';
    result.classList.remove('hidden');
    bossPriceBox.classList.remove('hidden');
    return;
  }

  bossPrice.value = '';

  // 不要每打一個字就打一次後端
  result.textContent = '正在確認代理碼…';
  result.classList.remove('hidden');

  agentCheckTimer = setTimeout(async () => {
    const checkingCode = String(input.value || '').trim().toLowerCase();

    // 使用者等待期間又改了代理碼，就放棄這次結果
    if (checkingCode !== code) return;

    const config = await loadAgentConfig(code);

    // 查詢回來時再次確認輸入框沒有被改掉
    if (String(input.value || '').trim().toLowerCase() !== code) return;

    if (!config) {
      currentAgentConfig = null;
      result.textContent = '代理碼無效或目前未啟用';
      result.classList.remove('hidden');
      return;
    }

    currentAgentConfig = config;

    result.textContent = '✓ ' + config.agentName;

    result.classList.remove('hidden');
  }, 350);
}

    };

      console.error("代理驗證 JSONP 載入失敗");

      cleanup();
      resolve(null);
    };

    const timer = setTimeout(function(){

      console.error("代理驗證逾時");

      cleanup();
      resolve(null);

    },10000);

    script.src =
      API +
      "?agent=" + encodeURIComponent(code) +
      "&callback=" + encodeURIComponent(cb) +
      "&_=" + Date.now();

    document.body.appendChild(script);
  });
}

// ===== 壓縮代理轉帳證明 =====
function compressAgentProof(file){
  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onerror=()=>reject(
      new Error("讀取轉帳證明失敗")
    );

    reader.onload=()=>{

      const img=new Image();

      img.onerror=()=>reject(
        new Error("無法讀取這張圖片")
      );

      img.onload=()=>{

        const maxSize=1600;

        let width=img.width;
        let height=img.height;

        if(width>maxSize || height>maxSize){

          const scale=Math.min(
            maxSize/width,
            maxSize/height
          );

          width=Math.round(width*scale);
          height=Math.round(height*scale);
        }

        const canvas=document.createElement("canvas");

        canvas.width=width;
        canvas.height=height;

        const ctx=canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        const base64Data=canvas.toDataURL(
          "image/jpeg",
          0.82
        );

        resolve({
          base64Data:base64Data,
          mimeType:"image/jpeg",
          fileName:"transfer-proof.jpg"
        });
      };

      img.src=reader.result;
    };

    reader.readAsDataURL(file);
  });
}


// ===== 查詢轉帳證明上傳結果 =====
function checkAgentProofUpload(uploadId){

  return new Promise((resolve,reject)=>{

    const cb=
      "proof_"+Date.now()+"_"+
      Math.random().toString(36).slice(2,7);

    const script=document.createElement("script");

    let timer;

    window[cb]=data=>{
      cleanup();
      resolve(data);
    };

    function cleanup(){
      clearTimeout(timer);
      delete window[cb];
      script.remove();
    }

    script.onerror=()=>{
      cleanup();
      reject(new Error("查詢轉帳證明失敗"));
    };

    timer=setTimeout(()=>{
      cleanup();
      reject(new Error("查詢轉帳證明逾時"));
    },8000);

    script.src=
      API+
      "?uploadId="+encodeURIComponent(uploadId)+
      "&callback="+encodeURIComponent(cb)+
      "&_="+Date.now();

    document.body.appendChild(script);
  });
}


// ===== 上傳代理轉帳證明，只上傳一次 =====
async function uploadAgentProof(){

  const input=
    document.getElementById("transferProofFile");

  const file=input.files && input.files[0];

  if(!file){
    throw new Error("請上傳轉帳證明");
  }

  if(!file.type.startsWith("image/")){
    throw new Error("轉帳證明必須是圖片");
  }

  const compressed=
    await compressAgentProof(file);

  const uploadId=
    "PROOF-"+Date.now()+"-"+
    Math.random().toString(36).slice(2,8);

  await postNoCors({
    action:"uploadAgentTransferProof",
    uploadId:uploadId,
    base64Data:compressed.base64Data,
    fileName:compressed.fileName,
    mimeType:compressed.mimeType
  });

  // 等待 Apps Script 完成 Drive 上傳
  for(let i=0;i<15;i++){

    try{

      const result=
        await checkAgentProofUpload(uploadId);

      if(
        result &&
        result.success &&
        result.status==="completed" &&
        result.url
      ){
        return result.url;
      }

    }catch(err){
      // 暫時查不到就繼續等
    }

    await new Promise(
      resolve=>setTimeout(resolve,1000)
    );
  }

  throw new Error(
    "轉帳證明已送出，但暫時無法確認上傳結果，請勿重複送出"
  );
}

    document.getElementById("name").value.trim();

  // ===== 基本資料檢查 =====

  if(!name){

  }

  agentBatchOrders.push(order);

// ===== 更新本批訂單摘要 =====

document
  .getElementById("agentBatchActionBox")

document

  alert(

    Number(order.agentAmount).toLocaleString()+"\n\n"+
    "目前共 "+agentBatchOrders.length+" 筆訂單"

   function startNextAgentOrder(){

  if(shopMode !== "agent" || !loggedAgentConfig){
    return alert("代理資料讀取失敗，請重新登入代理");
  }

  // 清空目前購物車，已加入本批的訂單不受影響
  cart = {};

  count();

  // 清空上一位客人的資料
  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("contactAccount").value = "";
  document.getElementById("feedback").value = "";
  document.getElementById("storeType").value = "7-ELEVEN";
  document.getElementById("storeName").value = "";
  document.getElementById("agentShippingCode").value = "";

  // 清除門市驗證顯示
  document
    .getElementById("storeVerify")
    .classList.add("hidden");

  // 隱藏上一筆完成後的操作區
  document
    .getElementById("agentBatchActionBox")
    .classList.add("hidden");

  // 下一筆之後仍然會再使用「加入本批訂單」
  document
    .getElementById("agentBatchAddBtn")
    .classList.remove("hidden");

  // 回商品頁開始選第二筆
  show("shop");
}

let shopSlideIndex = 0;
let shopSlideTimer = null;

function initShopSlider(){
  clearInterval(shopSlideTimer);

  const track = document.querySelector(".slider-track");
  const slides = document.querySelectorAll(".slider-track img");

  if(!track || !slides.length) return;

  const dotsBox = document.querySelector(".slider-dots");

if(dotsBox){
  dotsBox.innerHTML = Array.from(slides).map((_,i)=>
    `<span class="slider-dot ${i===0 ? "active" : ""}"></span>`
  ).join("");
}
  shopSlideIndex = 0;

  shopSlideTimer = setInterval(()=>{
    moveShopSlider(1);
  },4000);
}

function moveShopSlider(direction){
  const track = document.querySelector(".slider-track");
  const slides = document.querySelectorAll(".slider-track img");
  const dots = document.querySelectorAll(".slider-dot");

  if(!track || !slides.length) return;

  shopSlideIndex += direction;

  if(shopSlideIndex >= slides.length){
    shopSlideIndex = 0;
  }

  if(shopSlideIndex < 0){
    shopSlideIndex = slides.length - 1;
  }

  track.scrollTo({
    left: track.clientWidth * shopSlideIndex,
    behavior:"smooth"
  });

  dots.forEach((dot,i)=>{
    dot.classList.toggle("active",i===shopSlideIndex);
  });
}
