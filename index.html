<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheets 連線測試 V3</title><style>body{font-family:-apple-system,sans-serif;background:#f6f4fb;margin:0;color:#222}main{max-width:680px;margin:auto;padding:24px}.card{background:#fff;border-radius:22px;padding:24px;margin-top:24px}h1{margin-top:0}.big{font-size:22px;font-weight:800;margin:18px 0}.ok{color:#16803a}.bad{color:#b42318}.muted{color:#777;line-height:1.6}.stat{padding:13px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}button{width:100%;border:0;border-radius:14px;padding:14px;background:#6842c2;color:#fff;font-weight:800}</style></head><body><main><div class="card"><h1>Google Sheets 連線測試 V3</h1><p class="muted">只驗證網站能否讀取試算表；不顯示商品名稱、不提供購物或下單。</p><div id="state" class="big">⏳ 正在連線…</div><div id="stats"></div><p id="time" class="muted"></p><button onclick="loadSheet()">重新同步</button></div></main><script>
const U="https://docs.google.com/spreadsheets/d/1I1i9bTTNYsNlg8qkSi9VLOmci-IplxfBANU-cEJDFoc/export?format=csv&gid=181370413";
function csv(t){let a=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x=='"'&&q&&n=='"'){c+='"';i++}else if(x=='"')q=!q;else if(x==','&&!q){r.push(c);c=""}else if((x=='\n'||x=='\r')&&!q){if(x=='\r'&&n=='\n')i++;r.push(c);c="";if(r.some(v=>v.trim()))a.push(r);r=[]}else c+=x}if(c||r.length){r.push(c);if(r.some(v=>v.trim()))a.push(r)}return a}
async function loadSheet(){let s=document.getElementById("state"),z=document.getElementById("stats"),tm=document.getElementById("time");s.className="big";s.textContent="⏳ 正在連線…";z.innerHTML="";tm.textContent="";try{let x=await fetch(U+"&_="+Date.now(),{cache:"no-store"});if(!x.ok)throw Error("HTTP "+x.status);let rows=csv(await x.text()).slice(1),p=[[0,1],[2,3],[4,5],[6,7]],n=p.map(([a,b])=>rows.filter(r=>(r[a]||"").trim()&&(r[b]||"").trim()).length);s.className="big ok";s.textContent="✅ Google Sheets 連線成功";z.innerHTML=n.map((v,i)=>'<div class="stat"><span>資料區 '+(i+1)+'</span><b>'+v+' 筆</b></div>').join("")+'<div class="stat"><span>合計</span><b>'+n.reduce((a,b)=>a+b,0)+' 筆</b></div>';tm.textContent="最後同步："+new Date().toLocaleString("zh-TW")}catch(e){s.className="big bad";s.textContent="❌ Google Sheets 連線失敗";tm.textContent="請確認共用權限為「知道連結的任何人－檢視者」。錯誤："+e.message}}loadSheet();
</script></body></html>
