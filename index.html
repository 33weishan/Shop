<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商城 V5.3</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f4fb;color:#222}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eee;padding:16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900}.badge{font-size:12px;background:#eee;padding:4px 8px;border-radius:12px}.purple{border:0;background:#6842c2;color:#fff;font-weight:800;border-radius:14px;padding:12px 15px}.wrap{max-width:760px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#6842c2,#9879e4);color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.tab{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:10px 13px;border-radius:18px;font-weight:700}.tab.on{background:#222;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.panel{background:#fff;border-radius:18px;padding:16px}.name{font-size:18px;font-weight:800}.stock,.muted{font-size:13px;color:#777}.stock{margin:6px 0 13px}.add{width:100%;border:0;border-radius:12px;background:#6842c2;color:#fff;font-weight:800;padding:11px}.add:disabled{background:#ccc}.hidden{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.qty button{border:0;border-radius:9px;padding:7px 11px}.qty span{display:inline-block;min-width:30px;text-align:center}.wide{width:100%;margin-top:10px}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:6px 0 12px;background:#fff}label{font-weight:800}.result{padding:13px;border-radius:12px;background:#f2f2f2;margin-top:12px}.summary{line-height:1.8}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><div class="brand">商城 <span class="badge">V5.3</span></div><button class="purple" onclick="showCart()">購物車 <span id="cc">0</span></button></header>
<main class="wrap">
<section id="shop"><div class="hero"><h1>商品選購</h1><div>即時庫存</div><div id="sync" class="muted" style="color:white;margin-top:8px">同步中…</div></div><div class="tabs" id="tabs"></div><div class="grid" id="products"></div></section>
<section id="cart" class="hidden"><div class="panel"><h2>購物車</h2><div id="rows"></div><p><b>共 <span id="tq">0</span> 件</b></p><button class="purple wide" onclick="goCheckout()">前往填寫取貨資料</button><button class="wide" onclick="show('shop')">繼續購物</button></div></section>
<section id="checkout" class="hidden"><div class="panel"><h2>取貨資料</h2>
<label>姓名</label><input id="name" autocomplete="name" placeholder="請輸入姓名">
<label>手機號碼</label><input id="phone" inputmode="tel" maxlength="10" placeholder="09xxxxxxxx">
<label>取貨超商</label><select id="storeType"><option value="">請選擇</option><option>7-ELEVEN</option><option>全家</option></select>
<label>取貨門市</label><input id="storeName" placeholder="例如：XX門市">
<div id="msg" class="result hidden"></div>
<button id="orderBtn" class="purple wide" onclick="submitOrder()">確認送出訂單</button>
<button class="wide" onclick="showCart()">返回購物車</button>
<p class="muted">送出後系統會再次確認庫存。訂單成立後才會扣除庫存。</p></div></section>
<section id="done" class="hidden"><div class="panel"><h2>✓ 訂單已成立</h2><div id="receipt" class="summary"></div><p class="muted">我們會盡快處理您的訂單。</p><button class="purple wide" onclick="finish()">完成</button></div></section>
</main><script>
const CSV="https://docs.google.com/spreadsheets/d/1I1i9bTTNYsNlg8qkSi9VLOmci-IplxfBANU-cEJDFoc/export?format=csv&gid=121866907";
const API="https://script.google.com/macros/s/AKfycbxyJSU-_4X3gOCRvfEoEhe2ETWkQjXBcHCTIco4BubYDziINuOYCwLPaCvvzTrimUDU/exec";
const SPECS=[
 {label:"分類1",nameCol:0,stockCol:1,start:5,end:38},
 {label:"分類2",nameCol:6,stockCol:7,start:5,end:28},
 {label:"分類3",nameCol:9,stockCol:10,start:5,end:31},
 {label:"分類4",nameCol:12,stockCol:13,start:5,end:24}
];
let groups=[],active=0,cart={},sending=false;

function csv(t){let a=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x=='"'&&q&&n=='"'){c+='"';i++}else if(x=='"')q=!q;else if(x==','&&!q){r.push(c);c=""}else if((x=='\n'||x=='\r')&&!q){if(x=='\r'&&n=='\n')i++;r.push(c);c="";a.push(r);r=[]}else c+=x}if(c||r.length){r.push(c);a.push(r)}return a}
async function load(){try{let z=await fetch(CSV+"&_="+Date.now(),{cache:"no-store"});let all=csv(await z.text());groups=SPECS.map((s,g)=>({name:s.label,items:all.slice(s.start,s.end+1).filter(r=>(r[s.nameCol]||"").trim()).map((r,i)=>({key:g+"-"+i,name:(r[s.nameCol]||"").trim(),stock:Math.max(0,parseInt(r[s.stockCol])||0)}))}));document.getElementById("sync").textContent="✓ 庫存已更新";renderTabs();render()}catch(e){document.getElementById("sync").textContent="庫存同步失敗"}}
function renderTabs(){document.getElementById("tabs").innerHTML=groups.map((g,i)=>`<button class="tab ${i===active?"on":""}" onclick="active=${i};renderTabs();render()">${g.name}</button>`).join("")}
function render(){let g=groups[active];document.getElementById("products").innerHTML=(g?.items||[]).map(p=>`<div class="card"><div class="name">${esc(p.name)}</div><div class="stock">庫存 ${p.stock}</div><button class="add" ${p.stock<1?"disabled":""} onclick="add('${p.key}')">${p.stock<1?"已售完":"加入購物車"}</button></div>`).join("")}
function find(k){for(let g of groups){let p=g.items.find(x=>x.key===k);if(p)return p}}
function add(k){let p=find(k),q=cart[k]||0;if(q<p.stock)cart[k]=q+1;count()}
function count(){document.getElementById("cc").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function show(id){["shop","cart","checkout","done"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));scrollTo(0,0)}
function showCart(){let ids=Object.keys(cart),el=document.getElementById("rows");el.innerHTML=ids.length?ids.map(k=>{let p=find(k);return `<div class="row"><div><b>${esc(p.name)}</b></div><div class="qty"><button onclick="chg('${k}',-1)">−</button><span>${cart[k]}</span><button onclick="chg('${k}',1)">＋</button></div></div>`}).join(""):"<p>購物車目前是空的。</p>";document.getElementById("tq").textContent=Object.values(cart).reduce((a,b)=>a+b,0);show("cart")}
function chg(k,d){if(sending)return;let p=find(k),n=(cart[k]||0)+d;if(n<=0)delete cart[k];else cart[k]=Math.min(n,p.stock);count();showCart()}
function goCheckout(){if(!Object.keys(cart).length)return alert("購物車沒有商品");show("checkout")}
function makeId(){return "ORD-"+Date.now()+"-"+Math.random().toString(36).slice(2,9)}
function postNoCors(payload){return fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})}
function checkStatus(orderId){return new Promise((resolve,reject)=>{let cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),s=document.createElement("script"),timer;window[cb]=d=>{cleanup();resolve(d)};function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}s.onerror=()=>{cleanup();reject(Error("查詢失敗"))};timer=setTimeout(()=>{cleanup();reject(Error("查詢逾時"))},8000);s.src=API+"?orderId="+encodeURIComponent(orderId)+"&callback="+cb+"&_="+Date.now();document.body.appendChild(s)})}
async function waitResult(id){for(let i=0;i<12;i++){try{let d=await checkStatus(id);if(d.status==="completed"||d.status==="failed")return d}catch(e){}await new Promise(r=>setTimeout(r,1000))}throw Error("訂單已送出，但暫時無法確認結果。請勿重複送出")}
async function submitOrder(){if(sending)return;let name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.replace(/\s/g,""),storeType=document.getElementById("storeType").value,storeName=document.getElementById("storeName").value.trim(),m=document.getElementById("msg");
if(!name)return alert("請填寫姓名");if(!/^09\d{8}$/.test(phone))return alert("請輸入正確的10碼手機號碼");if(!storeType)return alert("請選擇取貨超商");if(!storeName)return alert("請填寫取貨門市");
let items=Object.keys(cart).map(k=>({productName:find(k).name,quantity:cart[k]})),orderId=makeId();sending=true;let b=document.getElementById("orderBtn");b.disabled=true;m.classList.remove("hidden");m.textContent="訂單送出中，請勿重複按…";
try{await postNoCors({orderId,customer:{name,phone,storeType,storeName},items});let d=await waitResult(orderId);if(!d.success){m.textContent="❌ "+(d.message||"訂單失敗");await load();return}
document.getElementById("receipt").innerHTML=`訂單編號：<b>${esc(d.orderId)}</b><br>姓名：${esc(d.customer.name)}<br>手機：${esc(d.customer.phone)}<br>取貨超商：${esc(d.customer.storeType)}<br>取貨門市：${esc(d.customer.storeName)}<br><br>商品：<br>`+d.items.map(x=>`${esc(x.productName)} × ${x.quantity}`).join("<br>");
cart={};count();await load();show("done")}catch(e){m.textContent="⚠️ "+e.message+"（訂單編號："+orderId+"）"}finally{sending=false;b.disabled=false}}
function finish(){document.getElementById("name").value="";document.getElementById("phone").value="";document.getElementById("storeType").value="";document.getElementById("storeName").value="";document.getElementById("msg").classList.add("hidden");show("shop")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
load();</script></body></html>
